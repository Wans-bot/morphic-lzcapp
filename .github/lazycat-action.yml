version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: out/morphic.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: app
build:
  run_buildscript: false

images:
  - id: app
    target: service
    service: morphic
    source: ghcr.io/miurla/morphic
    channel: custom
    tag_regex: '^v?\d+\.\d+\.\d+$'
    sort: semver
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales:
      - zh-CN
    application:
      language: zh
      brief: "AI 答案引擎"
      description: "开源的 AI 答案引擎。先用自带 SearXNG 检索全网，再由大模型整理成带引用来源的答案，支持连续追问与多种搜索模式。"
      keywords: "AI搜索, 答案引擎, 联网检索, 引用来源, SearXNG"
      support_pc: true
      screenshot_pc_files:
        - ".github/screenshots/pc-1.png"
        - ".github/screenshots/pc-2.png"
        - ".github/screenshots/pc-3.png"
  private:
    enabled: false
