version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: out/morphic.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: app
    # 上游 ghcr.io/miurla/morphic 只发 40 位 commit sha，没有语义化版本，
    # 所以按 digest 变化递增 patch 位（文档：Mutable tags and automatic patch bumps）。
    bump: patch

build:
  run_buildscript: false

images:
  - id: app
    target: service
    service: morphic
    source: ghcr.io/miurla/morphic
    channel: custom
    tag_regex: '^[0-9a-f]{40}$'
    sort: created
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales:
      - zh
      - en
    application:
      language: zh
      brief: "AI 答案引擎"
      description: "开源的 AI 答案引擎。先用自带 SearXNG 检索全网，再由大模型整理成带引用来源的答案，支持连续追问与多种搜索模式。"
      keywords: "AI搜索, 答案引擎, 联网检索, 引用来源, SearXNG"
      support_pc: true
      screenshot_pc_files:
        - ".github/screenshots/pc-1.png"
        - ".github/screenshots/pc-2.png"
        - ".github/screenshots/pc-3.png"
      screenshot_mobile_files:
        - ".github/screenshots/mobile-1.png"
        - ".github/screenshots/mobile-2.png"
        - ".github/screenshots/mobile-3.png"
  private:
    enabled: false
