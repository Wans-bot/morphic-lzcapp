# Morphic —— 开源 AI 搜索（答案引擎）
#
# 架构：morphic（Next.js，3000）+ postgres 17 + redis + searxng。
# 搜索能力由自带的 SearXNG 提供，不需要任何搜索 API key；
# 只有「用模型生成答案」这一步需要用户自己的 OpenAI 兼容端点（见 lzc-deploy-params.yml）。
application:
  subdomain: morphic
  upstreams:
    - location: /
      backend: http://morphic.cloud.lazycat.app.morphic.lzcapp:3000
      # Next.js 自己处理路由，网关不要裁路径
      disable_trim_location: true
  health_check:
    # 应用级检测：直接给 http url，不依赖容器内部有 curl/wget
    test_url: http://morphic.cloud.lazycat.app.morphic.lzcapp:3000/
    # 首次启动要先建库并跑迁移，给足时间
    start_period: 900s
    timeout: 10s
  # ── 封掉上游自带的 /auth/* 路由（官方审核 #20762 驳回根因） ──
  # 上游 Morphic 是一个带账号体系的应用，Next.js 构建时把 /auth/login、/auth/sign-up、
  # /auth/forgot-password、/auth/update-password、/auth/admin、/auth/confirm 等页面
  # **无条件注册**进了路由表；ENABLE_AUTH=false 只把「界面里的登录入口」摘掉
  # （capabilities 全 false：没有 Sign Up / Forgot password / Google 登录 / 分享），
  # 页面组件本身没有 `if (!isAuthEnabled()) redirect("/")` 这类兜底。
  # 于是直接访问 /auth/login 仍会渲染出「Welcome back / Sign in to your account /
  # Email / Password / Sign In」的邮箱+密码表单 —— 评审就是这样拿到一张要密码的截图，
  # 给出「没有密码自动注入，也没有提供密码，无法测试」。
  # 微服应用的正确形态是「访问控制交给微服账号网关，应用内完全没有登录」，
  # 所以在网关层把整段 /auth/* 路由封死，落到应用首页。
  injects:
    # 1) request 阶段：/auth 与 /auth/* 一律回首页。
    #    auth_required 必须显式 false —— 默认 true 时「没有合法 SAFE_UID 的请求会被静默跳过」，
    #    而评审/匿名访问正是没有 SAFE_UID 的那种请求，注入会失效、登录页照样出来。
    - id: morphic-block-auth-pages
      'on': request
      auth_required: false
      when:
        - /auth
        - /auth/*
      do: |
        // 一律 302 回首页，不区分 RSC。
        // 试过对 RSC 预取（RSC: 1 头）回 `ctx.response.send(204, "")`，实测这条路径会
        // **断开连接不回任何字节**（curl 报 000，TLS 前置 nginx 记 502 Bad Gateway），
        // 比回 302 更糟。而页面里已经不存在任何指向 /auth/* 的链接（capabilities.signUp=false，
        // 没有注册/忘记密码/分享入口），App Router 不会去预取这些路由，所以统一 302 最稳。
        // 加 no-store：别让浏览器把这条重定向或后来的页面当缓存复用，避免评审拿到旧副本。
        ctx.response.send(302, "", {
          location: "/",
          headers: { "Cache-Control": "no-store" },
        });
    # 2) browser 阶段兜底：万一网关重定向被绕过（浏览器复用了旧的 /auth/login 缓存副本、
    #    或将来上游改成客户端 router.push 跳登录页），页面自己在 /auth/* 上立刻跳回首页。
    #    只匹配 /auth/*，不影响首页、/search/*、/api/* 与静态资源。
    - id: morphic-auth-page-guard
      'on': browser
      auth_required: false
      when:
        - /auth
        - /auth/*
      do: |
        (function () {
          var p = location.pathname;
          if (p === "/auth" || p.indexOf("/auth/") === 0) location.replace("/");
        })();
services:
  postgres:
    image: registry.lazycat.cloud/wans/library/postgres:54b52fdd68074990
    environment:
      - POSTGRES_USER=morphic
      # 与 morphic 服务里的 DATABASE_URL 用同一个 stable_secret，保证两端一致
      - POSTGRES_PASSWORD={{ stable_secret "morphic_pg_password" }}
      - POSTGRES_DB=morphic
    binds:
      - /lzcapp/var/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U morphic -d morphic
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
  redis:
    image: registry.lazycat.cloud/wans/library/redis:966d984e0a0c0c25
    # command 必须是字符串（写成数组平台安装会 400，而 project lint 不报）
    command: 'redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction'
    binds:
      - /lzcapp/var/redis:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  searxng:
    image: registry.lazycat.cloud/wans/searxng/searxng:94abda6f1da25347
    environment:
      # settings.yml 里写的是 8888，这里显式压成 8080，避免依赖镜像默认值
      - SEARXNG_PORT=8080
      - SEARXNG_BIND_ADDRESS=0.0.0.0
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET={{ stable_secret "morphic_searxng_secret" }}
    binds:
      # 关键：上游这份 settings.yml 声明了 search.formats: [json]。
      # 不挂它，SearXNG 默认只输出 html，Morphic 取 JSON 会 403。
      - /lzcapp/pkg/content/searxng/settings.yml:/etc/searxng/settings.yml
      - /lzcapp/pkg/content/searxng/limiter.toml:/etc/searxng/limiter.toml
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O- http://127.0.0.1:8080/ | grep -qi searx
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
  morphic:
    # upstream: ghcr.io/miurla/morphic:1aec3c0a9e0a8a8ca95793d3757fc74b20d9e372@sha256:f09e80695b27ba991cf1db9c2c5c426eda4951c3b09f71af1d95ebcf196fbf6e
    image: registry.lazycat.cloud/wans/miurla/morphic:a4b4fb10e1f92a38
    # 等三个依赖都真正 healthy 再起：entrypoint 会先跑 bun run migrate，
    # 数据库没起来就会迁移失败退出（上游 compose 里也是这个顺序）
    depends_on:
      - postgres
      - redis
      - searxng
    environment:
      - DATABASE_URL=postgresql://morphic:{{ stable_secret "morphic_pg_password" }}@postgres:5432/morphic
      - DATABASE_RESTRICTED_URL=postgresql://morphic:{{ stable_secret "morphic_pg_password" }}@postgres:5432/morphic
      - DATABASE_SSL_DISABLED=true
      # 访客身份由微服账号体系负责，应用内不再做登录
      - ENABLE_AUTH=false
      - ANONYMOUS_USER_ID=lazycat-anonymous
      - MORPHIC_CLOUD_DEPLOYMENT=false
      - LOCAL_REDIS_URL=redis://redis:6379
      # 搜索走自带的 SearXNG，无需搜索 API key
      - SEARCH_API=searxng
      - SEARXNG_API_URL=http://searxng:8080
      # ── 模型：来自部署参数，全部带兜底，避免缺失时被渲染成字面量 <no value> ──
      - OPENAI_COMPATIBLE_API_KEY={{ if (index .U "llm_api_key") }}{{ index .U "llm_api_key" }}{{ end }}
      - OPENAI_COMPATIBLE_API_BASE_URL={{ if (index .U "llm_api_base_url") }}{{ index .U "llm_api_base_url" }}{{ else }}https://api.deepseek.com{{ end }}
      - OPENAI_COMPATIBLE_MODELS={{ if (index .U "llm_models") }}{{ index .U "llm_models" }}{{ end }}
      - OPENAI_COMPATIBLE_PROVIDER_NAME={{ if (index .U "llm_provider_name") }}{{ index .U "llm_provider_name" }}{{ else }}DeepSeek{{ end }}
